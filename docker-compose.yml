version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: meadowmist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meadowmist
      POSTGRES_USER: meadowmist
      POSTGRES_PASSWORD: meadowmist_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meadowmist -d meadowmist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
